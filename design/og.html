<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@500&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#F6F1EA;color:#2A201B}
.wrap{display:grid;grid-template-columns:520px 1fr;height:630px}
.left{padding:70px 0 64px 76px;display:flex;flex-direction:column}
.word{font:500 104px/1 "Cormorant Garamond";letter-spacing:.3em}
.sub{margin-top:22px;font:500 17px/1 Jost;letter-spacing:.2em;text-transform:uppercase;color:#74655A}
.rule{width:56px;height:1px;background:#2A201B;margin:46px 0 34px}
.line{font:400 48px/1.08 "Cormorant Garamond";max-width:11ch}
.line em{color:#6E1F2A}
.url{margin-top:auto;font:500 15px/1 Jost;letter-spacing:.16em;text-transform:uppercase;color:#74655A}
.photos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:40px 40px 40px 0}
.photos div{overflow:hidden;background:#EFE7DC}
.photos div:nth-child(2){margin-top:46px;margin-bottom:-46px}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
</style></head>
<body><div class="wrap">
<div class="left">
  <div class="word">SANA</div>
  <div class="sub">Style, Beauty &amp; Finds</div>
  <div class="rule"></div>
  <div class="line">Budget finds that look <em>way more expensive.</em></div>
  <div class="url">sanastylebeauty.pages.dev</div>
</div>
<div class="photos">
  <div><img src="../public/uploads/p-sheer-sleeve-draped-maxi-gown.webp" style="object-position:30% 30%"></div>
  <div><img src="../public/uploads/p-mock-neck-backless-mini-dress.webp" style="object-position:50% 30%"></div>
  <div><img src="../public/uploads/p-floral-button-sweater-vest.webp" style="object-position:50% 30%"></div>
</div>
</div></body></html>
